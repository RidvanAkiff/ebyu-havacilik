  <use href="#plane" transform="translate(300,260) scale(1.1) rotate(-14)"/>
  <use href="#plane" transform="translate(1300,220) scale(0.9) rotate(12)"/>
  <use href="#plane" transform="translate(820,360) scale(0.5) rotate(-4)" opacity="0.7"/>

  <rect y="560" width="1600" height="340" fill="url(#ground)"/>
