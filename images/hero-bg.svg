    <line x1="800" y1="650" x2="800" y2="720" stroke-dasharray="0"/>
    <line x1="800" y1="760" x2="800" y2="860" stroke-dasharray="0"/>
  </g>
  <g fill="#F4C542" opacity="0.9">
