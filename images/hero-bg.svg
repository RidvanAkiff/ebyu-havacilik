      <polygon points="-8,0 -38,-62 -22,-62 22,0" fill="#ffffff" opacity="0.95"/>
      <polygon points="-8,0 -38,62 -22,62 22,0" fill="#ffffff" opacity="0.95"/>
      <polygon points="-62,0 -76,-26 -66,-26 -50,0" fill="#ffffff"/>
      <polygon points="-62,0 -76,26 -66,26 -50,0" fill="#ffffff"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="260" cy="150" rx="140" ry="36"/>
    <ellipse cx="330" cy="130" rx="90" ry="34"/>
    <ellipse cx="1180" cy="110" rx="170" ry="40"/>
    <ellipse cx="1280" cy="88" rx="100" ry="34"/>
