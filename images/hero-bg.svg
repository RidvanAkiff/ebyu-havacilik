<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BA4E6"/>
      <stop offset="0.55" stop-color="#9CCBF2"/>
      <stop offset="1" stop-color="#D9ECFA"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E7D4F"/>
      <stop offset="1" stop-color="#2A5A38"/>
    </linearGradient>
    <linearGradient id="runway" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A4655"/>
      <stop offset="1" stop-color="#1E2631"/>
    </linearGradient>
    <g id="plane">
